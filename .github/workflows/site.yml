name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:17 UTC on the 10th of each month: refresh NASA data, lock the next
    # season's forecasts (seasons start 1 Dec, Mar, Jun, Sep), score finished ones.
    - cron: "17 6 10 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the site shows when each forecast was committed

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data and lock the next season's forecasts
        if: github.event_name != 'push'
        run: |
          python build.py --fetch-only --refresh
          python forecast.py issue --within-days 25
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw forecasts
          if ! git diff --cached --quiet; then
            git commit -m "Monthly NASA data refresh and forecast lock"
            git push
          fi

      - name: Tests
        run: python -m pytest -q

      - name: Build site
        run: python build.py --places places.csv

      - name: Build the Vercel copy (same data, share links point at Vercel)
        run: python build.py --places places.csv --out site-vercel --base-url "$VERCEL_URL"
        env:
          VERCEL_URL: https://cassandra-signal-climate.vercel.app/

      - name: Publish the Vercel copy to the vercel-site branch (Vercel deploys it, no build)
        if: github.ref == 'refs/heads/main'
        run: |
          cp vercel.json site-vercel/vercel.json
          cd site-vercel
          git init -q -b vercel-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built site from ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vercel-site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
